name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Failures are reported twice: as a rendered digest in the run summary (for the
# web UI) and as workflow ERROR ANNOTATIONS. The annotations matter because they
# come back through the check-runs API as a few kilobytes of JSON, so a failure
# can be diagnosed without downloading the log archive — `gh run view --log`
# pulls every job's log as one zip, which is not viable on a slow connection.

jobs:
  foundry:
    name: Foundry — build, size gate, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # OpenZeppelin is an npm dependency, not a submodule — the remapping in
      # foundry.toml points into node_modules, so the install has to come first.
      - run: npm ci

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Build
        run: |
          set -o pipefail
          if forge build --sizes 2>&1 | tee build.log; then
            echo "### Foundry build: OK" >> "$GITHUB_STEP_SUMMARY"
          else
            digest=$(grep -E "^(Error|error\[|Warning|Compiler run failed)|-->" build.log | head -25)
            [ -n "$digest" ] || digest=$(tail -25 build.log)
            echo "::error title=forge build failed::$(echo "$digest" | sed ':a;N;$!ba;s/\n/%0A/g')"
            { echo "### Foundry build: FAILED"; echo '```'; echo "$digest"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: EIP-170 size gate
        run: |
          forge build --sizes --json > sizes.json
          python3 - <<'PY'
          import json, os, sys
          sizes = json.load(open("sizes.json"))
          info = sizes.get("BlazePhoenixStaking")
          if info is None:
              print("::error title=size gate::BlazePhoenixStaking absent from build output")
              sys.exit(1)
          runtime = info["runtime_size"]
          margin = 24576 - runtime
          line = f"BlazePhoenixStaking runtime {runtime} B, margin {margin} B of 24576"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"### Size gate: {line}\n")
          if margin < 0:
              print(f"::error title=size gate::{line}")
              sys.exit(1)
          print(f"::notice title=size gate::{line}")
          PY

      - name: Foundry tests
        run: |
          set -o pipefail
          if forge test -vv 2>&1 | tee test.log; then
            echo "### Foundry tests: OK" >> "$GITHUB_STEP_SUMMARY"
          else
            digest=$(grep -E "^\[FAIL|^Suite result|^Error|^Failing tests:" test.log | head -25)
            [ -n "$digest" ] || digest=$(tail -25 test.log)
            echo "::error title=forge test failed::$(echo "$digest" | sed ':a;N;$!ba;s/\n/%0A/g')"
            { echo "### Foundry tests: FAILED"; echo '```'; echo "$digest"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Deeper invariant/fuzz pass (REPORT-ONLY — never gates)
        # `|| true` is deliberate: a deep campaign is a search, not a bound, and
        # its variance would make the gating job flaky. Labelled so nobody reads
        # a green tick here as a proof — the gate is the hermetic run above. The
        # conservation invariant is known to be fuzz-flaky (vault note 116), and
        # this is where that signal belongs: visible, not blocking. If one of
        # these ever discharges deterministically, promote it into the gate and
        # drop the `|| true`.
        run: |
          forge test --match-path "test/*Invariant*" --fuzz-runs 512 --invariant-runs 128 --invariant-depth 128 -vv || true
          forge test --match-path "test/*Conservation*" --fuzz-runs 512 -vv || true

  yul-guard:
    name: Yul evaluation-order guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Builtin arguments evaluate RIGHT TO LEFT
        # Yul evaluates a builtin's arguments right to left, so
        # `and(staticcall(...), eq(returndatasize(), 32))` tests the size left by
        # the PREVIOUS external call, not by this one. That shipped once in the
        # Dex (Core._curveCryptoGetDy) and cost a silently inert protocol floor.
        # MathLib currently uses the safe idiom everywhere — capture the call
        # result in a variable, then test returndatasize() — and this job is what
        # keeps it that way: a comment asking people not to "simplify" it back is
        # a plea, a CI job is the rule. Costs ~2s and no compiler. The comment
        # filter is required: the warning text itself contains the pattern.
        run: |
          if grep -rnE 'and\((staticcall|call|delegatecall|callcode)\(' src/ | grep -vE ':\s*(///|//|\*)'; then
            echo "::error title=Yul evaluation order::Builtin arguments evaluate right-to-left — capture the call result in a variable first, then test returndatasize()."
            exit 1
          fi
          echo "### Yul evaluation-order guard: clean" >> "$GITHUB_STEP_SUMMARY"

  formal:
    name: formal verification (Halmos symbolic, report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # OpenZeppelin is an npm dependency, not a submodule — the remapping in
      # foundry.toml points into node_modules, so the install comes first.
      - run: npm ci
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install Halmos
        run: pip install halmos
      - name: Symbolic spec — MathLib (report-only)
        # test/formal/MathLibFormalSpec.t.sol. REPORT-ONLY on arrival, and the
        # `|| true` is deliberate: the Dex measured that properties routing
        # through the 512-bit assembly mulDiv reach `mulmod`, which Halmos
        # over-approximates, so they time out instead of discharging — and a
        # check that cannot decide has no place in a gate. The spec here states
        # the single-word and domain-edge properties, which SHOULD discharge.
        #
        # Promotion rule, inherited from the Dex: a check moves into a hard gate
        # only after a report-only run has MEASURED it discharging cleanly. This
        # job is where that measurement happens. If these discharge, promote them
        # and drop the `|| true`.
        #
        # Bounded at the process rather than with timeout-minutes, which marks a
        # step CANCELLED — GitHub propagates a cancellation to the job even under
        # continue-on-error, so the step would go red for doing exactly what it
        # is expected to do.
        run: timeout 1500 halmos --contract MathLibFormalSpec -v || true
      - name: Note
        run: echo "Report-only. A TIMEOUT here is an expected outcome and gates nothing." >> "$GITHUB_STEP_SUMMARY"

  node-evm:
    name: Node — real-EVM harness (9 suites)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # All nine suites run even after one fails, so a single round reports every
      # problem rather than only the earliest.
      - name: Real-EVM suites
        run: |
          failed=""
          for suite in smoke run attack boost vectors dimensions final reporting selfaudit; do
            echo "::group::$suite"
            if node "test/$suite.mjs" > "$suite.log" 2>&1; then
              echo "- **$suite** — OK" >> "$GITHUB_STEP_SUMMARY"
            else
              failed="$failed $suite"
              digest=$(grep -E "✗|Error:|error:|throw " "$suite.log" | head -12)
              [ -n "$digest" ] || digest=$(tail -15 "$suite.log")
              echo "::error title=$suite failed::$(echo "$digest" | sed ':a;N;$!ba;s/\n/%0A/g')"
              { echo "- **$suite** — FAILED"; echo '```'; echo "$digest"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
            cat "$suite.log"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "### Failing suites:$failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "### All nine real-EVM suites passed" >> "$GITHUB_STEP_SUMMARY"
