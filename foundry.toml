[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 150
via_ir = true
# OpenZeppelin resolves through the npm dependency declared in package.json, not
# through lib/. `.gitignore` ignores lib/ wholesale, and openzeppelin-contracts was
# never a registered submodule, so a fresh clone got an empty directory and the
# build failed on a missing import. package-lock.json pins the version, which makes
# this the reproducible source rather than the incidental one. Run `npm ci` before
# `forge build`.
remappings = ["@openzeppelin/=node_modules/@openzeppelin/"]

[lint]
# `block-timestamp` is inherent to the design, not an oversight: this is a staking protocol whose
# locks run 90..2555 days and whose emission is a 7-year clock, so reading time IS the requirement.
# The drift a validator can introduce is seconds against windows of months. Excluded globally
# rather than silenced 16 times inline.
exclude_lints = ["block-timestamp"]

[profile.ci]
fuzz = { runs = 256 }
